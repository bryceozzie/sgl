name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        # eslint, plus the DD-00 §2 import boundaries and the determinism ban
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Grammar is up to date
        # DD-10 §3: the generated parser is committed; CI regenerates and fails if
        # the committed output differs.
        run: |
          pnpm grammar
          git diff --exit-code -- packages/core/src/grammar

      - name: Build
        # Must precede tests: a workspace package's cross-package imports resolve
        # through its `exports`, which point at `dist/`, and `tsc -b` above does not
        # copy a package's hand-generated JS assets (e.g. @sgl/core's Lezer parser)
        # the way `tsdown` does.
        run: pnpm build

      - name: Unit and golden tests
        run: pnpm test:unit

      - name: Install Playwright browsers
        # Only Chromium and Firefox — WebKit joins with test:e2e (Stage I/K).
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Browser tests
        # vitest browser mode (Chromium, Firefox) — the worker host and worker
        # runtime against a real Worker (DD-06 §10), plus the F9 bench
        # (bench/README.md; prints, does not gate on timing).
        run: pnpm test:browser

      - name: Install WebKit (apps/web e2e needs all three; Chromium/Firefox already installed above)
        run: pnpm exec playwright install --with-deps webkit

      - name: apps/web e2e (Chromium, Firefox, WebKit)
        # DD-08 §14, against a production build (vite build + vite preview) —
        # `pnpm check` itself only runs the Chromium project (Stage I part 2
        # decision), so this is CI's own wider run per DD-10 §4.
        run: pnpm test:e2e:all-browsers

      - name: Audit
        run: pnpm audit --prod --audit-level high

  # ⟶ Steps from DD-10 §4 still to arrive with the code they test:
  #
  #   size          size-limit on the core chunk (< 180 kB gz, hard 300)
  #
  # And nightly: bench against the DD-09 §2 targets, commenting on regressions over
  # the hard ceiling.
