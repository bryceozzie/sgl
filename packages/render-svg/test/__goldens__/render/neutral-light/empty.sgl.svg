<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sgl" data-sgl="1.0" width="0" height="0" viewBox="0 0 0 0" role="img" aria-labelledby="sgl-t sgl-d"><title id="sgl-t">Diagram</title><desc id="sgl-d">0 nodes, 0 connections, 0 groups.</desc><style>svg.sgl{--sgl-canvas:#F7F8FA;--accent:#1F5F80;--bg:#F7F8FA;--danger:#A8323F;--font-sans:Inter, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif;--ink:#1B2330;--ink-muted:#5B6675;--line:#8A96A8;--surface:#FFFFFF;--surface-sunken:#EEF1F5}
